name: Terraform (dev)

# Plans infra changes on PRs and applies them on merge to main.
# Apply is gated by the `infra-dev` GitHub Environment (add required reviewers
# there for a manual approval gate).
#
# Required repo Variables:
#   AWS_REGION, AWS_TERRAFORM_ROLE_ARN, TF_STATE_BUCKET, TF_LOCK_TABLE,
#   TF_VAR_site_bucket_name, TF_VAR_github_repo
# (TF_VAR_* are passed straight through to Terraform input variables.)

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_site_bucket_name: ${{ vars.TF_VAR_site_bucket_name }}
  TF_VAR_github_repo: ${{ vars.TF_VAR_github_repo }}
  TF_VAR_create_oidc_provider: "false"

jobs:
  plan:
    # Skip cleanly until infra-via-CI is configured (we apply locally otherwise).
    if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Plan
        run: terraform plan -input=false -no-color

  apply:
    needs: plan
    if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: infra-dev
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Apply
        run: terraform apply -input=false -auto-approve
